spring.application.name=logAnalyticsService

server.servlet.context-path=
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

# Write application logs to a local file
logging.file.name=logs/application.log

# Format each file entry as one JSON object
logging.structured.format.file=logstash

# Keep local log files under control
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

aws.region=${AWS_REGION:us-west-1}
aws.athena.database=log_analytics_db
aws.athena.output-location=s3://log-analytics-sravanthi-2026/athena-results/